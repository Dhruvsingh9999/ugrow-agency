<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Ugrow</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0A0A0A;
  --ink:#0A0A0A;
  --ink-soft:#6B6B6B;
  --green:#5FD936;
  --green-neon:#7CF04A;
  --rule:#E3E3E1;
  --serif:'Sora',system-ui,sans-serif;
  --sans:'Manrope',system-ui,sans-serif;
}
body{font-family:var(--sans);background:#fff;color:var(--ink);line-height:1.65;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;width:100%}
@media(min-width:900px){.wrap{padding:0 48px}}

.nav{padding:22px 0}
.nav .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:24px;text-decoration:none;letter-spacing:-.04em;display:flex;align-items:flex-start}
.brand i{font-style:normal;color:var(--green);font-size:13px;margin:-3px 0 0 1px;transform:rotate(-45deg)}

main{display:grid;align-items:center;padding:64px 0}
.code{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:22px;display:flex;align-items:center;gap:12px}
.code::before{content:'';width:28px;height:2px;background:var(--green)}
h1{font-family:var(--serif);font-weight:600;letter-spacing:-.03em;line-height:1.05;font-size:clamp(38px,6vw,68px);max-width:14ch}
p{font-size:17px;color:var(--ink-soft);max-width:52ch;margin:22px 0 34px}

.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:6px;font-weight:600;font-size:14px;letter-spacing:.02em;text-decoration:none;border:1px solid transparent;transition:background .25s,color .25s,border-color .25s}
.btn-bronze{background:var(--black);color:var(--green-neon);border-color:var(--black)}
.btn-bronze:hover{background:#222;border-color:#222}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}

footer{padding:34px 0;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-soft)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Ugrow home">ugrow<i>&#10148;</i></a>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="code">Error 404</div>
    <h1>This page moved out.</h1>
    <p>The link you followed doesn't lead anywhere. The listings, the reels and the rest of the work are still where you left them.</p>
    <div class="actions">
      <a class="btn btn-bronze" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/work">See the work</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; 2026 Ugrow</span>
    <span>Dubai &middot; Chandigarh</span>
  </div>
</footer>

</body>
</html>
